name: api

on:
  push:
    paths: ["api/**", "spec/**", "contracts/**", "docs/plan/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", "spec/**", "contracts/**", "docs/plan/**", ".github/workflows/api.yml"]
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dev" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://dev:dev@127.0.0.1:5432/panaderia_ci
      TEST_DATABASE_URL: postgresql+psycopg://dev:dev@127.0.0.1:5432/panaderia_test_ci
      ENVIRONMENT: test
      SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            spec/requirements.txt
      - name: Instalar dependencias
        run: pip install -r api/requirements.txt -r spec/requirements.txt
      - name: Pruebas de la API
        working-directory: api
        run: python -m pytest -q
      - name: Contrato al día (export_openapi --check)
        working-directory: api
        run: python -m scripts.export_openapi --check
      - name: Modelo de dinero y coherencia del plan (spec)
        run: python -m pytest spec -q
