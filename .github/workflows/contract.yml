name: contract

on:
  push:
    paths: ["api/**", "contracts/**", ".github/workflows/contract.yml"]
  pull_request:
    paths: ["api/**", "contracts/**", ".github/workflows/contract.yml"]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # export_openapi importa la app sin conectarse (engine perezoso); la URL solo debe ser válida.
      DATABASE_URL: postgresql+psycopg://dev:dev@127.0.0.1:5432/panaderia_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - name: Contrato generado desde la API (sin ediciones a mano)
        working-directory: api
        run: python -m scripts.export_openapi --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Spectral (camelCase y x-roles)
        run: npx --yes @stoplight/spectral-cli@6.16.3 lint contracts/openapi.json --ruleset contracts/.spectral.yaml --fail-severity error
