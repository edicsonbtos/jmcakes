name: web

on:
  push:
    branches: [main, "claude/**", "block/**"]
    paths: ["web/**", "contracts/**", "docs/design/tokens.json", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "contracts/**", "docs/design/tokens.json", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Modo mock (01 §Autenticación): nunca un secreto real en CI.
  JWT_SECRET: dev-mock-secret-no-usar-en-prod
  WEB_PORT: "3000"
  MOCK_PORT: "4010"
  NEXT_PUBLIC_API_URL: http://127.0.0.1:4010/api/v1

jobs:
  web:
    name: lint, test y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright test --list

  e2e-web:
    name: Playwright contra Prism (capturas 1440 y 390 px)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright
        run: npx playwright test
        env:
          CI: "1"
          CAPTURE_DIR: ${{ github.workspace }}/web/e2e-capturas
      - name: Capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-web
          path: web/e2e-capturas/
          if-no-files-found: warn
          retention-days: 14
      - name: Reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14
