[pytest]
# Desde api/: `TEST_DATABASE_URL=postgresql+psycopg://dev:dev@127.0.0.1:5432/panaderia_test_<id> python -m pytest -q`
testpaths = tests
pythonpath = . ../spec
asyncio_mode = strict
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -p no:cacheprovider
markers =
    committed: la prueba usa transacciones reales (fixture committed_db)
